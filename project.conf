# Project name and minimum BuildStream version
name: builtprefixes
min-version: 2.5

# Element path where .bst files are stored
element-path: elements

(@):
  - freedesktop-sdk.bst:include/runtime.yml
  # Local copy of the mirrors needed to fetch our own junctions (see
  # include/mirrors.yml for why this can't just come from the junction).
  # Must be listed before freedesktop-sdk.bst's own mirrors.yml below so
  # that file's fuller list wins once junctions are available (this one
  # is only consulted directly during the junction "first pass" load).
  - include/mirrors.yml
  # Mirror definitions for source aliases (gcc.gnu.org, sourceware.org, etc.
  # are rate-limited or flaky; mirrors fall back to freedesktop-sdk GitLab)
  - freedesktop-sdk.bst:include/_private/mirrors.yml

aliases:
  (@):
    - include/aliases.yml
    - freedesktop-sdk.bst:include/_private/aliases.yml

fatal-warnings:
- overlaps
- unaliased-url

# Define plugin origins
plugins:
- origin: junction
  junction: plugins/buildstream-plugins-community.bst
  elements:
  - cargo
  sources:
  - cargo2
  - git_repo
- origin: pip
  package-name: buildstream-plugins
  elements:
  - autotools
  sources:
  - git
  - patch

junctions:
  internal:
  - plugins/buildstream-plugins-community.bst

options:
  target_arch:
    type: arch
    variable: target-arch
    description: Target architecture
    values:
    - i686
    - x86_64

# Variables for the project
variables:
  prefix-root: "%{install-root}/pfx"
  proton-root: "/proton" 
  
# Build environment configuration
environment:
  WINEPREFIX: "%{prefix-root}"
  WINE: "/proton/files/bin/wine"
  WINEARCH: "win32"
  DISPLAY: ":99"
  STEAM_COMPAT_CLIENT_INSTALL_PATH: "/tmp/steam-dummy"
  STEAM_COMPAT_DATA_PATH: "%{prefix-root}"
  MAXJOBS: "%{max-jobs}"

sources:
  git_repo:
    config:
      ref-format: git-describe 
  git:
    config:
      ref-format: git-describe
  cargo2:
    config:
      url: "crates:crates/"
